version: '3.8'

# Master 节点部署配置
# 使用方法: docker compose -f docker-compose.master.yml up -d

services:
  rabbit-panel-master:
    image: reisen7/rabbit-panel:latest
    container_name: rabbit-panel-master
    restart: unless-stopped
    user: root
    ports:
      - "3958:3958"
      # 启用 TLS 且需要 HTTP 跳转时取消注释：
      # - "3959:3959"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/rabbit-panel/compose_projects:/app/compose_projects
      - /opt/rabbit-panel/data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - MODE=master
      - PORT=3958
      # 可不填：未填时首次启动自动生成并保存到数据目录 secrets.env（重启不变；宿主机查看 cat /opt/rabbit-panel/data/secrets.env，配 Worker 需要它）。
      # 如需自行指定：openssl rand -hex 32（至少 32 字符，示例值会拒绝启动）；Worker 需填入与 Master 相同的值。
      - JWT_SECRET=${JWT_SECRET:-}
      - NODE_SECRET=${NODE_SECRET:-}
      # 面板内在线更新：compose 文件名与服务名必须与本文件一致，否则更新会落到默认 deploy 配置
      - RABBIT_DEPLOY_MODE=docker
      - RABBIT_IMAGE=reisen7/rabbit-panel
      - RABBIT_IMAGE_TAG=latest
      - RABBIT_HOST_PROJECT_DIR=/opt/rabbit-panel
      - RABBIT_COMPOSE_FILE=docker-compose.master.yml
      - RABBIT_SERVICE_NAME=rabbit-panel-master
      # - RABBIT_UPDATE_CHECK_DISABLED=true  # set to true to skip the update check (no manifest fetch)
      # ===== 原生 HTTPS（默认 HTTP，需要时取消注释）=====
      # - TLS_ENABLED=true
      # - TLS_SELF_SIGNED=true            # 证书缺失时自动生成自签证书（保存到 ./data/certs）
      # - TLS_CERT_FILE=/app/data/certs/server.crt
      # - TLS_KEY_FILE=/app/data/certs/server.key
      # - TLS_HOSTS=panel.example.com,x.x.x.x   # 自签证书需要覆盖的域名/IP
      # - HTTP_PORT=3959                  # 可选：HTTP 自动跳转到 HTTPS 的端口（同时取消上面的端口映射注释）
      # - TLS_REDIRECT_PORT=3958          # 跳转目标端口；容器端口被映射成别的对外端口时必填（如 -p 8443:3958 则填 8443）
      # 集群内使用自签证书时，Master 访问 Worker 也需要放开校验，二选一（不设则跨节点调用会报证书错误）：
      # - NODE_TLS_INSECURE=true
      # - NODE_CA_FILE=/app/data/certs/ca.crt      # 更安全：指定受信任的 CA
    healthcheck:
      # HTTPS / HTTP 两种模式都能通过
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3958/api/health || wget -q --no-check-certificate --spider https://localhost:3958/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
