version: '3.8'

# Worker 节点部署配置
# 使用方法: docker compose -f docker-compose.worker.yml up -d
# 注意: 请先修改 MASTER_URL 和 NODE_NAME

services:
  rabbit-panel-worker:
    image: reisen7/rabbit-panel:latest
    container_name: rabbit-panel-worker
    restart: unless-stopped
    user: root
    ports:
      - "10001:10001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/rabbit-panel/compose_projects:/app/compose_projects
      - /root/rabbit-panel/data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - MODE=worker
      - PORT=10001
      # 必须修改: Master 节点地址
      # 面板默认 HTTP。Master 启用了 HTTPS 时改为 https://
      - MASTER_URL=http://master-ip:3958
      # 必须修改: 当前节点名称（每个 Worker 必须唯一）
      - NODE_NAME=worker-1
      # 必须修改: Master 能访问到的本机地址（宿主机 IP:映射端口）
      # 桥接网络里自动探测到的是容器内网 IP，跨机器不可达
      # 不要带协议前缀，Worker 会按自身是否启用 HTTPS 自动补协议
      - NODE_ADDRESS=192.168.1.20:10001
      # 必填，且与 Master 相同。未设置或仍是示例值时容器不会启动。
      - JWT_SECRET=${JWT_SECRET:?请设置 JWT_SECRET，用 openssl rand -hex 32 生成，并与 Master 保持一致}
      - NODE_SECRET=${NODE_SECRET:?请设置 NODE_SECRET，用 openssl rand -hex 32 生成，并与 Master 保持一致}
      # ===== 原生 HTTPS（默认 HTTP，需要时取消注释）=====
      # - TLS_ENABLED=true
      # - TLS_SELF_SIGNED=true
      # - TLS_HOSTS=worker-1.example.com,192.168.1.20   # 自签证书需要覆盖的域名/IP
      # 集群内使用自签证书时，访问 Master 需放开校验，二选一（不设则注册/心跳会报证书错误）：
      # - NODE_TLS_INSECURE=true
      # - NODE_CA_FILE=/app/data/certs/ca.crt      # 更安全：指定受信任的 CA
    healthcheck:
      # HTTPS / HTTP 两种模式都能通过
      test: ["CMD-SHELL", "wget -q --spider http://localhost:10001/api/health || wget -q --no-check-certificate --spider https://localhost:10001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
