version: '3.8'

services:
  rabbit-panel:
    image: reisen7/rabbit-panel:latest
    container_name: rabbit-panel
    restart: unless-stopped
    ports:
      - "3958:3958"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/rabbit-panel/compose_projects:/app/compose_projects
      - /root/rabbit-panel/data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - PORT=3958
      - JWT_SECRET=change-me-in-production
      - NODE_SECRET=change-me-in-production
      - RABBIT_DEPLOY_MODE=docker
      - RABBIT_IMAGE=reisen7/rabbit-panel
      - RABBIT_IMAGE_TAG=latest
      - RABBIT_HOST_PROJECT_DIR=/root/rabbit-panel
      - RABBIT_COMPOSE_FILE=docker-compose.deploy.yml
      # - RABBIT_UPDATE_CHECK_DISABLED=true  # set to true to skip the update check (no manifest fetch)
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3958/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
